<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#1E293B" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Outer Ambient Flame Aura -->
  <circle cx="256" cy="270" r="140" fill="#38BDF8" opacity="0.15" filter="url(#cyanGlow)" />

  <!-- Kurama Flame Icon -->
  <g transform="translate(136, 116) scale(10)" filter="url(#cyanGlow)">
    <path
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
      fill="url(#flameGrad)"
      stroke="#38BDF8"
      stroke-width="0.75"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
